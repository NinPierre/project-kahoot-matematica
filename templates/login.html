{% extends 'base.html' %}

{% block title %}Login — Quiztech Matemático{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center;">
    <div class="card animate-in" style="width:100%; max-width:420px;">
        <h1 class="card-title" style="font-size:1.5rem;">
            <i class="fa-solid fa-lock"></i> Login
        </h1>

        {% if error %}
            <div class="alert alert-error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" style="display:flex; flex-direction:column; gap:1rem;">
            <div class="input-group">
                <label class="input-label"><i class="fa-solid fa-user"></i> Nome de usuário</label>
                <input type="text" name="username" placeholder="Digite seu nome" class="input" required>
            </div>
            <div class="input-group">
                <label class="input-label"><i class="fa-solid fa-key"></i> Senha</label>
                <input type="password" name="password" placeholder="Digite sua senha" class="input" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; border-radius:10px; padding:.75rem 1rem; margin-top:.5rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
        </form>
    </div>
</div>
{% endblock %}
