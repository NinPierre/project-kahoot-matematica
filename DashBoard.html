<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do Professor</title>
</head>

<body>

    <header>

        <section>
            <a href="home.html">
                <h1>Logo</h1>
            </a>
        </section>

        <section>
            <h1>Dashboard do Professor</h1>
        </section>

        <section>
            <a href="login.html">
                <h2>Login</h2>
            </a>
        </section>

    </header>

    <main>

        <!-- Criar perguntas -->
        <section>

            <h2>Adicionar Pergunta</h2>

            <form>

                <input
                    type="text"
                    placeholder="Digite a pergunta"
                >

                <br><br>

                <input
                    type="text"
                    placeholder="Alternativa A"
                >

                <br><br>

                <input
                    type="text"
                    placeholder="Alternativa B"
                >

                <br><br>

                <input
                    type="text"
                    placeholder="Alternativa C"
                >

                <br><br>

                <input
                    type="text"
                    placeholder="Alternativa D"
                >

                <br><br>

                <input
                    type="text"
                    placeholder="Resposta correta"
                >

                <br><br>

                <button>
                    Salvar Pergunta
                </button>

            </form>

        </section>

        <hr>

        <!-- Perguntas cadastradas -->
        <section>

            <h2>Perguntas Criadas</h2>

            <div>
                <p>Nenhuma pergunta cadastrada.</p>
            </div>

        </section>

        <hr>

        <!-- Gerenciamento -->
        <section>

            <h2>Gerenciamento</h2>

            <button>Editar Perguntas</button>

            <button>Excluir Perguntas</button>

            <button>Criar Sala</button>

        </section>

    </main>
,
    <footer>

        <p>Painel do Professor</p>

    </footer>

</body>
</html>
